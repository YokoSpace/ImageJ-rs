[package]
name = "ij-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ij-core = { path = "../ij-core" }
ij-io = { path = "../ij-io" }
ij-session = { path = "../ij-session" }
ij-bridge = { path = "../ij-bridge" }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lib]
name = "ij_app"
path = "src/lib.rs"

[[bin]]
name = "ij-app"
path = "src/main.rs"
