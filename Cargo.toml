[workspace]
resolver = "2"
members = [
    "crates/ij-core",
    "crates/ij-io",
    "crates/ij-session",
    "crates/ij-bridge",
    "crates/ij-cli",
    "crates/ij-app",
    "crates/ij-plugin-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
